<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b45"><title>KYK管理システム Version 0.2.9</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header"><div><h1>KYK管理システム <small>v0.2.9</small></h1><small id="dbStatus">KYKDB.xlsx 自動読込中</small></div><button class="sub" id="btnDb">KYKDB再読込</button><input id="dbFile" type="file" accept=".xlsx" hidden></header>
<main id="app">
<section id="screen-top" class="screen active"><div class="hero"><h2>メニュー</h2><p id="dbGuide">起動時にGitHub上のKYKDB.xlsxを自動で読み込みます。通信できない場合は端末に保存済みのデータを使用します。</p></div><div class="menu-grid"><button data-go="basic" class="primary">新規作成</button><button data-go="saved">保存済一覧</button><button data-go="approval">元請確認</button></div></section>
<section id="screen-basic" class="screen"><div class="screen-title"><button class="back" data-go="top">←</button><h2>基本情報</h2></div><div class="card form-grid"><label class="required">作業日<input id="workDate" type="date"></label><label class="required">現場名<select id="site"></select></label><label class="required">会社名<select id="company"></select></label></div><div class="card"><div class="label-title required-text">作成者（手書きサイン）</div><canvas class="sign-pad" id="creatorPad"></canvas><div class="sign-actions"><button type="button" id="clearCreator">書き直す</button><span id="creatorSignStatus">未署名</span></div></div><div class="actions"><button class="primary" data-go="work">作業内容へ</button></div></section>
<section id="screen-work" class="screen"><div class="screen-title"><button class="back" data-go="basic">←</button><h2>作業内容</h2></div><div class="work-nav card"><button id="prevWork">← 前へ</button><strong id="workIndicator">作業 1／1</strong><button id="nextWork">次へ →</button></div><div id="workRows"></div><div class="actions split"><button id="addWork">＋ 作業を追加</button><button id="removeWork" class="danger">この作業を削除</button></div><div class="card"><label>職長から（72文字以内）<textarea id="foremanComment" maxlength="72" rows="4"></textarea></label><div class="counter"><span id="foremanCount">0</span>/72</div></div><div class="actions"><button class="primary" data-go="checks">点検項目へ</button></div></section>
<section id="screen-checks" class="screen"><div class="screen-title"><button class="back" data-go="work">←</button><h2>点検項目</h2></div><div class="card check-grid"><label><input id="checkScaffold" type="checkbox"> 足場点検</label><label><input id="checkTools" type="checkbox"> 工具点検</label><label><input id="checkClothes" type="checkbox"> 服装点検</label><label><input id="checkPpe" type="checkbox"> 保護具点検</label></div><div class="actions"><button class="primary" data-go="workers">作業員入力へ</button></div></section>
<section id="screen-workers" class="screen"><div class="screen-title"><button class="back" data-go="checks">←</button><h2>作業員</h2></div><div id="workerRows"></div><div class="actions"><button class="danger" id="btnDelete" hidden>削除</button><button class="primary" id="btnSave">保存</button></div></section>
<section id="screen-saved" class="screen"><div class="screen-title"><button class="back" data-go="top">←</button><h2>保存済一覧</h2></div><div class="card search-grid"><label>現場名<select id="searchSite"></select></label><label>会社名<select id="searchCompany"></select></label></div><div class="card bulk-export"><div><strong>一括Excel出力</strong><div id="bulkExportInfo" class="meta">対象なし</div></div><button id="btnBulkExport" class="primary" disabled>選択現場を一括Excel出力</button></div><div id="savedList"></div></section>
<section id="screen-approval" class="screen"><div class="screen-title"><button class="back" data-go="top">←</button><h2>元請確認</h2></div><div class="card"><label>現場名<select id="approvalSite"></select></label><label class="inline"><input id="includeApproved" type="checkbox"> 確認済みも表示</label></div><div id="approvalList"></div></section>
<section id="screen-approve-detail" class="screen"><div class="screen-title"><button class="back" data-go="approval">←</button><h2>元請確認入力</h2></div><div id="approvalSummary" class="card"></div><div class="card"><label>元請から（72文字以内）<textarea id="principalComment" maxlength="72" rows="4"></textarea></label><div class="counter"><span id="principalCount">0</span>/72</div><div class="label-title required-text">元請確認（手書きサイン）</div><canvas class="sign-pad" id="principalPad"></canvas><div class="sign-actions"><button type="button" id="clearPrincipal">書き直す</button><span id="principalSignStatus">未署名</span></div></div><div class="actions"><button class="primary" id="btnApprove">確認して保存</button></div></section>
</main><div id="toast" role="status"></div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="js/jszip.min.js"></script><script src="js/app.js"></script>
</body></html>
